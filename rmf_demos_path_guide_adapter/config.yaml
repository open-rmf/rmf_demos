# FLEET CONFIG =================================================================
# RMF Fleet parameters
#
# A template, shipped for reference. Nothing loads it by default --
# launch/path_guide_adapter.launch.xml takes `config_file` as an argument, so a
# demo world passes its own. The `rmf_fleet` values here mirror the stock
# tinyRobot fleet, so a reader comparing this against
# rmf_demos_fleet_adapter's reference sees the same robot described the same
# way, and only the Path Guide specifics differ.

rmf_fleet:
  name: "tinyRobot"
  limits:
    linear: [0.5, 0.75] # velocity, acceleration
    angular: [0.6, 2.0] # velocity, acceleration
  profile: # Robot profile is modelled as a circle
    footprint: 0.3 # radius in m
    vicinity: 0.5 # radius in m
  reversible: True # whether robots in this fleet can reverse
  # Path Guide's one tolerance knob, and it does double duty. RMF uses it to
  # merge the robot back onto its lane, retrying at up to 10x, so merging
  # self-heals. It is ALSO the upper bound this adapter publishes as
  # PathWaypoint.merge_radius, and the integrator's arrival test cannot safely
  # exceed it -- so setting it too tight caps arrival at nothing and paths
  # stall with no such escalation. Size it from a measured closest approach,
  # never from theory: a robot rounds a corner further from the vertex than
  # its cornering parameter suggests.
  #
  # 0.5 rather than the 0.3 default, to leave room for that. Widened per
  # vertex by any `merge_radius` set in the nav graph.
  max_merge_lane_distance: 0.5 # m
  # NOTE: no `arrival_radius` key. PathGuide publishes no arrival radius --
  # deciding when a waypoint counts as reached is the integrator's call.
  battery_system:
    voltage: 12.0 # V
    capacity: 24.0 # Ahr
    charging_current: 5.0 # A
  mechanical_system:
    mass: 20.0 # kg
    moment_of_inertia: 10.0 #kgm^2
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0 # W
  tool_system:
    power: 0.0 # W
  recharge_threshold: 0.10 # Battery level below which robots in this fleet will not operate
  recharge_soc: 1.0 # Battery level to which robots in this fleet should be charged up to during recharging tasks
  # Seconds of delay on the current itinerary before RMF interrupts and
  # replans. Worth setting explicitly rather than taking the 10.0 default: a
  # Path Guide robot holds its whole route, so a lift wait or a slow corner
  # accrues against this before anything replans.
  max_delay: 15.0 # s
  publish_fleet_state: 10.0 # Publish frequency for fleet state, ensure that it is same as robot_state_update_frequency
  account_for_battery_drain: True
  task_capabilities: # Specify the types of RMF Tasks that robots in this fleet are capable of performing
    loop: True
    delivery: True
  finishing_request: "park" # [park, charge, nothing]
  robots:
    # Here the user is expected to append the configuration for each robot in the fleet.
    tinyBot_1:
      charger: "tinybot_charger"

fleet_manager:
  ip: "127.0.0.1"
  port: 7001
  user: "some_user"
  password: "some_password"
  # For computing transforms between Robot and RMF coordinate systems
  # For demos, robots operate in the same coordinate system as RMF
  reference_coordinates:
    rmf: [[0.0, 0.0 ],
          [1.0, 1.0],
          [2.0, 2.0],
          [3.0, 3.0]]
    robot: [[0.0, 0.0 ],
          [1.0, 1.0],
          [2.0, 2.0],
          [3.0, 3.0]]
